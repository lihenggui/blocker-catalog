name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts/rules -p 'test_*.py'
      - run: python -m unittest discover -s scripts/crawl -p 'test_*.py'
      - run: python -m unittest discover -s scripts/publish -p 'test_*.py'
      - run: python scripts/rules/validate.py --check
