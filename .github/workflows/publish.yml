name: Publish catalog

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts/rules -p 'test_*.py'
      - run: python -m unittest discover -s scripts/crawl -p 'test_*.py'
      - run: python -m unittest discover -s scripts/publish -p 'test_*.py'
      - name: Publish catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          LEGACY_DEPLOY_KEY: ${{ secrets.LEGACY_DEPLOY_KEY }}
        run: python -B scripts/publish/publish.py
