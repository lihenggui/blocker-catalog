name: Crawl component index

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency: crawl
permissions:
  contents: write
  pull-requests: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Restore crawl state
        run: |
          mkdir -p .crawl-state
          if git ls-remote --exit-code origin refs/heads/crawl-state > /dev/null; then
            git fetch --depth=1 --no-tags origin refs/heads/crawl-state
            git archive FETCH_HEAD | tar -x -C .crawl-state
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
          fi
      - uses: actions/cache@v4.2.3
        with:
          path: .cache/manifests/
          key: crawl-${{ github.run_id }}
          restore-keys: crawl-
      - name: Crawl Android components
        id: crawl
        continue-on-error: true
        run: python scripts/crawl/crawl.py all --max-minutes 300 --state-dir .crawl-state
        env:
          CODE_SEARCH_TOKEN: ${{ secrets.CODE_SEARCH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save crawl state
        run: |
          # Use a separate index and a parentless commit for the resumable snapshot.
          export GIT_INDEX_FILE="$RUNNER_TEMP/crawl-state.index"
          git -C .crawl-state --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=. \
            add --all --force -- . ':(exclude,glob)**/*.tmp'
          tree=$(git write-tree)
          commit=$(git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" -m 'Save crawler state' \
            -m 'Keep the latest checkpoint available for the next crawl.')
          git push --force origin "$commit:refs/heads/crawl-state"
      - name: Check for evidence changes
        id: evidence
        run: |
          if [ -n "$(git status --porcelain -- evidence/)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: peter-evans/create-pull-request@v8.1.1
        if: steps.evidence.outputs.changed == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/crawl
          base: main
          title: 'Update component evidence'
          commit-message: |
            Update component evidence

            Record the latest package-prefix and coverage results for review.
          body: 'Update package-prefix attribution and component coverage from the crawler.'
          add-paths: evidence/
      - name: Report crawler failure
        if: steps.crawl.outcome == 'failure'
        run: exit 1
