recommendToBlock: false
contributor: blocker-component-index
lastUpdateTime: '2026-11-25T00:00:00Z'
i18n:
  en:
    description: The Fabric Crashlytics SDK uses this provider during app startup to initialize crash
      reporting. It also enables native crash reporting when the app opts in.
    disableEffect: Disabling it stops automatic Crashlytics initialization, so app crashes may no longer
      be reported.
  zh-CN:
    description: Fabric Crashlytics SDK 会在应用启动时通过此 Provider 初始化崩溃报告；如果应用启用了原生崩溃报告，它也会一并初始化。
    disableEffect: 停用后，Crashlytics 将不会自动初始化，应用崩溃可能无法上报。
